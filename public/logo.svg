<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" fill="none">
  <defs>
    <!-- Blue 3D Gradients for "ไทย" -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="30%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#091e42" />
    </linearGradient>
    
    <!-- Green Gradients for "พลัส+" & Orbit -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="greenSwooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <!-- Phone Gradients -->
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="40%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- White Sticker Outline Background for high contrast -->
    <!-- Green bottom dynamic swoop line -->
    <path d="M 80 320 Q 200 300 380 305 Q 260 325 80 320 Z" fill="url(#greenSwooshGrad)" />

    <!-- Big Stylized "ไทย" Lettering Graphic Representation -->
    <!-- Main Swash "ไ" Top Sweeping Curve -->
    <path d="M 45 165 C 55 130 90 110 140 85 C 190 60 235 68 250 82 C 260 92 255 108 238 120 C 205 142 165 160 135 180 C 110 198 90 220 85 245 C 80 268 92 285 115 285 C 145 285 180 250 195 210 L 220 220 C 198 275 150 310 105 310 C 65 310 48 280 52 245 C 56 215 78 185 112 160 C 145 138 188 118 215 102 C 225 96 228 90 220 86 C 210 82 175 92 130 115 C 90 135 60 152 45 165 Z" fill="url(#blueGrad)" />

    <!-- Core Body of "ไทย" (ท and ย connected loops with 3D volumetric strokes) -->
    <!-- "ท" Body -->
    <path d="M 95 280 C 85 270 85 240 102 210 C 120 180 150 165 178 165 C 205 165 215 185 208 210 C 200 235 175 280 140 280 C 122 280 112 270 118 255 C 122 245 135 235 152 230 C 160 228 165 220 168 210 C 172 198 165 190 152 190 C 132 190 115 210 108 235 C 102 255 108 270 120 270 C 135 270 158 245 168 225 L 188 235 C 172 265 142 290 115 290 C 102 290 95 285 95 280 Z" fill="url(#blueLightGrad)" opacity="0.95" />

    <!-- "ย" Swash and Body -->
    <path d="M 180 265 C 195 240 215 215 235 200 C 255 185 275 185 285 195 C 295 205 290 225 275 245 C 255 270 225 285 195 285 C 175 285 168 275 180 265 Z" fill="url(#blueGrad)" />
    <!-- Dynamic sweep tail under Thai -->
    <path d="M 60 300 C 130 270 250 260 380 272 C 260 288 140 305 60 300 Z" fill="url(#blueGrad)" />

    <!-- "ไทย" Thai Text Typography Layer for Perfect Clarity -->
    <text x="210" y="275" font-family="'Sarabun', 'Noto Sans Thai', 'Prompt', sans-serif" font-weight="900" font-style="italic" font-size="165" fill="url(#blueGrad)" text-anchor="middle" stroke="#ffffff" stroke-width="8" paint-order="stroke fill" letter-spacing="-6">
      ไทย
    </text>

    <!-- "พลัส+" Typography on Top Right in vibrant green -->
    <g transform="translate(250, 40)">
      <!-- Soft drop shadow / white backing for pop -->
      <text x="75" y="70" font-family="'Prompt', 'Kanit', 'Noto Sans Thai', sans-serif" font-weight="900" font-size="70" fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" text-anchor="middle">
        พลัส
      </text>
      <text x="75" y="70" font-family="'Prompt', 'Kanit', 'Noto Sans Thai', sans-serif" font-weight="900" font-size="70" fill="url(#greenGrad)" text-anchor="middle">
        พลัส
      </text>

      <!-- 3D Plus Sign (+) -->
      <g transform="translate(150, 15)">
        <circle cx="28" cy="28" r="26" fill="#ffffff" />
        <path d="M 22 10 L 34 10 L 34 22 L 46 22 L 46 34 L 34 34 L 34 46 L 22 46 L 22 34 L 10 34 L 10 22 L 22 22 Z" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="2" />
        <!-- Plus highlight -->
        <path d="M 24 13 L 32 13 L 32 24 L 43 24 L 43 30 L 32 30 L 32 43 L 26 43 L 26 30 L 13 30 L 13 24 L 24 24 Z" fill="#ffffff" opacity="0.35" />
      </g>
    </g>

    <!-- SMARTPHONE ILLUSTRATION ON THE RIGHT (rotated ~12 deg) -->
    <g transform="translate(370, 155) rotate(14)">
      <!-- Phone Outer Shadow -->
      <rect x="0" y="0" width="76" height="142" rx="16" fill="#0f172a" opacity="0.25" transform="translate(4, 6)" />

      <!-- Phone Outer Bezel -->
      <rect x="0" y="0" width="76" height="142" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
      <rect x="3" y="3" width="70" height="136" rx="14" fill="url(#phoneBody)" />

      <!-- Phone Screen -->
      <rect x="6" y="6" width="64" height="130" rx="11" fill="url(#phoneScreen)" />

      <!-- Screen Notch / Dynamic Island -->
      <rect x="25" y="10" width="26" height="6" rx="3" fill="#0f172a" />

      <!-- Screen Gloss Reflection -->
      <path d="M 6 6 L 50 6 L 6 80 Z" fill="#ffffff" opacity="0.3" rx="11" />

      <!-- Home Indicator -->
      <rect x="23" y="130" width="30" height="3" rx="1.5" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- DYNAMIC GREEN ORBIT RING WRAPPING AROUND PHONE -->
    <!-- Back part of orbit (behind phone) is drawn naturally by layer or clipping -->
    <ellipse cx="410" cy="245" rx="55" ry="24" fill="none" stroke="url(#greenGrad)" stroke-width="9" stroke-linecap="round" transform="rotate(-20 410 245)" />
    <!-- White outer rim for sticker look -->
    <ellipse cx="410" cy="245" rx="55" ry="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="20 15" opacity="0.7" transform="rotate(-20 410 245)" />

    <!-- Sparkle accents near phone -->
    <circle cx="468" cy="180" r="4" fill="#22c55e" />
    <circle cx="480" cy="195" r="3" fill="#84cc16" />
    <circle cx="475" cy="165" r="2" fill="#22c55e" />
  </g>
</svg>
